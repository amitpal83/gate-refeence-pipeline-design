# profiles.yml — Production/target profile: point dbt at
# Trino-on-Iceberg. Swap the `type` block for dbt-spark if Spark SQL is the
# execution engine instead of Trino; no model SQL changes needed either way.
gates:
  target: prod
  outputs:
    prod:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'gates_svc_dbt') }}"
      catalog: "{{ env_var('TRINO_CATALOG', 'iceberg') }}"
      schema: "{{ env_var('TRINO_SCHEMA', 'gates') }}"
      threads: 4
