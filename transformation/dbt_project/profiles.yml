# profiles.yml — Production/target profile: point dbt at
# Trino-on-Iceberg. Swap the `type` block for dbt-spark if Spark SQL is the
# execution engine instead of Trino; no model SQL changes needed either way.
gates:
  target: prod
  outputs:
    prod:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'gates_svc_dbt') }}"
      catalog: "{{ env_var('TRINO_CATALOG', 'gates') }}"
      # Fallback only — every bronze/silver/gold model sets its own +schema
      # (see dbt_project.yml), so this default only applies to a model that
      # somehow doesn't. Kept as "default" rather than "bronze"/"gold" so a
      # model missing its layer config is obviously misplaced, not silently
      # miscategorized.
      schema: "{{ env_var('TRINO_SCHEMA', 'default') }}"
      threads: 4
