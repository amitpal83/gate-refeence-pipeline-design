# schema_project_monitoring.yaml
# The ingestion contract for this dataset: the canonical target schema, PLUS
# each source's raw structure as actually delivered. This is one of only two
# config files per dataset — the other is column_aliasing.yaml, which maps
# each source's raw columns (below) onto the canonical fields (below).
dataset: project_monitoring
version: "1.0"
description: >
  Ingestion contract for R&D Project Monitoring, referenced by the Common
  Ingestion Framework (Airbyte + NAVI-GATES) and by the Great Expectations
  common validation suite.

# ---------------------------------------------------------------------------
# CANONICAL SCHEMA — the target shape every source must be mapped into
# ---------------------------------------------------------------------------
canonical_schema:
  unique_fields:
    - project_id
  fields:
    - name: project_id
      dtype: string
      required: true
      unique: true
      description: "Unique project code, e.g. PCHRD-2026-0142"
    - name: agency
      dtype: string
      required: true
      permissible_values: [PCHRD, PCAARRD, PCIEERD, ASTI, FNRI, ITDI, MIRDC, TAPI]
    - name: region
      dtype: string
      required: true
      permissible_values: [NCR, CAR, R1, R2, R3, R4A, R4B, R5, R6, R7, R8, R9, R10, R11, R12, R13, NIR]
    - name: program_area
      dtype: string
      required: true
      permissible_values: [Health, Agriculture, Industry, Basic Research, ICT, Disaster Resilience]
    - name: project_title
      dtype: string
      required: true
    - name: principal_investigator
      dtype: string
      required: true
    - name: start_date
      dtype: date
      required: true
      format: "%Y-%m-%d"
    - name: end_date
      dtype: date
      required: false
      format: "%Y-%m-%d"
    - name: budget_allocated_php
      dtype: float
      required: true
      min: 0
    - name: budget_utilized_php
      dtype: float
      required: true
      min: 0
    - name: status
      dtype: string
      required: true
      permissible_values: [Proposed, Ongoing, Completed, Terminated, On-Hold]
    - name: funding_source
      dtype: string
      required: true
      permissible_values: ["GAA", "Special Trust Fund", "Foreign-Assisted", "Counterpart"]

# ---------------------------------------------------------------------------
# SOURCES — each source's raw structure AS DELIVERED (no mapping here;
# column_aliasing.yaml is the only place raw -> canonical mapping happens)
# ---------------------------------------------------------------------------
sources:
  - source_id: pchrd_regional_file_dropbox
    channel: file
    file: "PCHRD_ProjectMonitoring_Q3_2026.xlsx"
    sheet: "Monitoring"
    agency: "PCHRD"
    region: "R4A"
    submitted_by: "regional.projectofficer@pchrd.dost.gov.ph"
    submission_date: "2026-08-25"
    raw_columns:
      - source_name: "Proj_ID"
        raw_dtype: "text"
      - source_name: "Program"
        raw_dtype: "text"
      - source_name: "Project Title"
        raw_dtype: "text"
      - source_name: "PI Name"
        raw_dtype: "text"
      - source_name: "Start_Date (mm/dd/yyyy)"
        raw_dtype: "text"        # delivered as text, not a real date type
      - source_name: "End_Date (mm/dd/yyyy)"
        raw_dtype: "text"
      - source_name: "Budget Allocated (Php)"
        raw_dtype: "text"        # contains thousands separators, e.g. "8,500,000.00"
      - source_name: "Budget Utilized (Php)"
        raw_dtype: "text"
      - source_name: "Status"
        raw_dtype: "text"
      - source_name: "Fund Source"
        raw_dtype: "text"

  - source_id: dost_pms_api
    channel: api
    note: >
      Raw structure defined by the Airbyte connector's own stream schema
      (schemas/project_monitoring.yaml, referenced from airbyte_manifest.yaml)
      rather than repeated here — it already matches canonical_schema
      field-for-field, so there is nothing additional to declare.

  - source_id: project_monitoring_cdc
    channel: kafka_cdc
    bootstrap_servers: "kafka:29092"
    database: source_database
    schema: project_schema
    # A single, denormalized source table — each Debezium change event on
    # this table already carries every canonical field, so
    # ingestion.batch_ingestion.BatchIngestor.ingest_cdc_records can use the
    # same identity-pass-through path as the API channel (no cross-table
    # join needed for a per-row CDC event). The "multiple tables from one
    # database" case is instead demonstrated by the rd_equipment_inventory
    # dataset's db_multitable source (see database/init_config_db.sql),
    # which genuinely does join two tables.
    tables: [projects]
    topic_pattern: "cdc.project_schema.*"
    agency: "PCHRD"
    region: "R4A"
