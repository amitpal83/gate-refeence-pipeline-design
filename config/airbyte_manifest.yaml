# airbyte_manifest.yaml — Airbyte low-code CDK connector definition
# Connector: project_monitoring_v1 (source: DOST Project Monitoring System API)
version: "0.79.0"

definitions:
  selector:
    extractor:
      field_path: ["data"]

  requester:
    url_base: "https://pms.dost.gov.ph/api/v1"
    http_method: "GET"
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_token'] }}"

  retriever:
    record_selector: "#/definitions/selector"
    requester: "#/definitions/requester"
    paginator:
      type: DefaultPaginator
      pagination_strategy:
        type: PageIncrement
        page_size: 200
      page_token_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: page

  project_monitoring_stream:
    type: DeclarativeStream
    name: project_monitoring
    primary_key: "project_id"
    retriever: "#/definitions/retriever"
    $parameters:
      path: "/projects/monitoring"
    schema_loader:
      type: InlineSchemaLoader
      schema_ref: "schemas/project_monitoring.yaml"   # -> resolves to schema_project_monitoring.yaml

streams:
  - "#/definitions/project_monitoring_stream"

check:
  stream_names:
    - project_monitoring

# ---- Sync configuration referenced by the Common Ingestion Framework ----
sync_config:
  dataset: project_monitoring
  source_id: dost_pms_api
  connector: project_monitoring_v1
  sync_mode: incremental
  cursor_field: "last_updated_at"
  frequency: daily
  target_path: "/staging/{agency}/project_monitoring/{date}/"
  schema_ref: "schema_project_monitoring.yaml"
  alias_ref: "column_aliasing.yaml"   # identity mapping for this source_id — see notes there
