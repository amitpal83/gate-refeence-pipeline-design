# Geo pipeline + PII protection services. An OVERRIDE file: it adds services
# to docker-compose.demo.yml and changes nothing that file defines, so the
# existing pipelines run exactly as before.
#
# Use both files together. On the EC2 host (SSM session, from /opt/gates-demo/app):
#   docker compose -f docker-compose.demo.yml -f docker-compose.geo.yml up -d openbao-perms openbao openbao-init
# The host's .env must also contain:
#   GATES_DATA_ROOT=/opt/gates-demo/data   (the encrypted EBS volume)
#   GATES_ENV=aws
#   OPENBAO_POC_ACK=yes                    (accepts the POC unseal-key-on-host trade-off)
# The systemd unit only starts docker-compose.demo.yml, so this file is started
# by hand, and openbao-init must be re-run after a host reboot to unseal.
#
# POC ONLY: OpenBao runs single-node with ONE unseal key share, stored on this
# host under .local-data/openbao-init (git-ignored). Production uses an HA
# Raft cluster with auto-unseal or HSM-backed unseal — see
# docs/PRODUCTION_SECURITY.md (planned step S12).

services:
  openbao-perms:
    # On a Linux Docker host, bind-mounted folders are created owned by root,
    # and OpenBao runs as its own user, so it could not write its data or
    # audit log. This one-shot fixes ownership first. It uses the OpenBao
    # image so the `openbao` user name resolves to the right uid.
    image: quay.io/openbao/openbao:2.1.0
    mem_limit: 64m
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mkdir -p /data /audit && chown -R openbao:openbao /data /audit
    volumes:
      - ${GATES_DATA_ROOT:-.local-data}/openbao:/data
      - ${GATES_DATA_ROOT:-.local-data}/openbao-audit:/audit
    restart: "no"

  openbao:
    image: quay.io/openbao/openbao:2.1.0
    mem_limit: 256m
    depends_on:
      openbao-perms:
        condition: service_completed_successfully
    # Comes back after a host reboot, but sealed. Re-run openbao-init to unseal.
    restart: unless-stopped
    # The image's start script already adds -config=/openbao/config (the whole
    # folder), which picks up the mounted config.hcl. Passing -config again
    # loads it twice and fails with "address already in use" on port 8200.
    command: ["server"]
    cap_add:
      - IPC_LOCK
    ports:
      # Loopback only. Never publish the key service to the team network.
      - "127.0.0.1:8200:8200"
    volumes:
      - ./deployment/openbao/config.hcl:/openbao/config/config.hcl:ro
      - ${GATES_DATA_ROOT:-.local-data}/openbao:/openbao/data
      - ${GATES_DATA_ROOT:-.local-data}/openbao-audit:/openbao/audit

  openbao-init:
    # One-shot, idempotent: initializes and unseals OpenBao on first run,
    # unseals on later runs, and (re)applies engines, keys, policies and
    # AppRoles. It writes the unseal key, root token and the two AppRole
    # credential files to /init. It finishes with a self-check that the
    # loader role cannot decrypt and the reader role cannot encrypt.
    image: quay.io/openbao/openbao:2.1.0
    # 64m was too small: the bao CLI was OOM-killed (exit 137). This container
    # runs for seconds and exits, so the higher cap is only held briefly.
    mem_limit: 256m
    depends_on:
      openbao:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
      GATES_ENV: ${GATES_ENV:-local}
      # Storing the unseal key on the host is demo-only. bootstrap.sh refuses
      # to run when GATES_ENV=aws unless this is set to "yes" on purpose.
      OPENBAO_POC_ACK: ${OPENBAO_POC_ACK:-}
    volumes:
      - ./deployment/openbao:/bootstrap:ro
      - ${GATES_DATA_ROOT:-.local-data}/openbao-init:/init
    entrypoint: ["/bin/sh", "-ec"]
    # One list item, not a bare multi-line string — same reason as kafka-init
    # in docker-compose.demo.yml.
    # tr strips Windows line endings, which would otherwise make sh fail on a
    # checkout that picked up CRLF.
    command:
      - tr -d '\r' < /bootstrap/bootstrap.sh > /tmp/bootstrap.sh && sh /tmp/bootstrap.sh
    restart: "no"

  # --- Geo stores (step S2) ---------------------------------------------
  # Needs these in the host's .env (see geo.env.example):
  #   GEO_DB_PASSWORD, GEOSERVER_ADMIN_PASSWORD
  # Compose reads the whole file, so every command that uses this override
  # fails until both are set.

  postgis:
    # Serving store for geo layers and the PII vault. Separate from the
    # `postgres` service (Airflow + config) and `source-db` (CDC source).
    image: postgis/postgis:16-3.4
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${GEO_DB_USER:-gates_geo}
      POSTGRES_PASSWORD: ${GEO_DB_PASSWORD:?Set GEO_DB_PASSWORD in .env}
      POSTGRES_DB: ${GEO_DB_NAME:-gates_geo}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # On the encrypted EBS data volume. Object-store encryption does not
      # cover this directory.
      - ${GATES_DATA_ROOT:-.local-data}/postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    # Internal only: loopback port, reached through an SSM port-forward. Hospital
    # and school locations are not public, so do not add it to the security
    # group's demo UI ports.
    image: kartoza/geoserver:2.25.2
    mem_limit: 1536m
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8600:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      INITIAL_MEMORY: 512M
      MAXIMUM_MEMORY: 1G
    volumes:
      - ${GATES_DATA_ROOT:-.local-data}/geoserver:/opt/geoserver/data_dir

  geo-init:
    # One-shot, same pattern as minio-init in docker-compose.demo.yml, but against
    # the encrypted minio-geo, not the existing minio.
    # The quarantine bucket holds rejected files with readable PII, so objects
    # expire after GEO_QUARANTINE_RETENTION_DAYS (default 14). MinIO applies
    # expiry on a schedule, so objects go within about a day of the limit.
    image: quay.io/minio/mc:latest
    mem_limit: 128m
    depends_on:
      minio-geo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio-geo:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/gates-geo
        mc mb --ignore-existing local/gates-geo-quarantine
        # Default encryption: every object written to these buckets is encrypted
        # with a data key that KES gets from OpenBao. The default key is normally
        # created by MinIO at start. Creating it here too is harmless if it exists.
        mc admin kms key create local geo-default > /dev/null 2>&1 || true
        mc encrypt set sse-kms geo-default local/gates-geo
        mc encrypt set sse-kms geo-default local/gates-geo-quarantine
        # Remove and re-add, so running this again never stacks duplicate rules.
        mc ilm rule rm --all --force local/gates-geo-quarantine > /dev/null 2>&1 || true
        mc ilm rule add --expire-days "$${GEO_QUARANTINE_RETENTION_DAYS}" local/gates-geo-quarantine
        # The archive keeps one copy of the protected layer and vault per batch,
        # while PostGIS keeps only the latest. Expire old batches.
        mc ilm rule rm --all --force local/gates-geo > /dev/null 2>&1 || true
        mc ilm rule add --expire-days "$${GEO_ARCHIVE_RETENTION_DAYS}" local/gates-geo
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      GEO_QUARANTINE_RETENTION_DAYS: ${GEO_QUARANTINE_RETENTION_DAYS:-14}
      GEO_ARCHIVE_RETENTION_DAYS: ${GEO_ARCHIVE_RETENTION_DAYS:-90}
    restart: "no"

  # --- Encrypted object storage for the geo files -------------------------
  # A dedicated MinIO (minio-geo) holds gates-geo and gates-geo-quarantine, with
  # default SSE-KMS encryption. The master keys live in OpenBao; KES sits between:
  #
  #   Airflow --S3--> minio-geo --mutual TLS--> kes --AppRole--> OpenBao (kv/kes/...)
  #
  # It is separate from the existing `minio` on purpose. A MinIO configured with KES
  # will not start while KES or OpenBao is unreachable, and OpenBao is sealed after
  # every reboot. Keeping it apart means the medallion pipelines (Trino, dbt) never
  # depend on OpenBao. Order: kes-certs, kes-bootstrap (needs OpenBao unsealed), kes,
  # minio-geo.

  kes-certs:
    # One-shot. Certificates for mutual TLS between MinIO and KES.
    image: alpine/openssl:latest
    mem_limit: 64m
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - tr -d '\r' < /bootstrap/gen-certs.sh > /tmp/gen-certs.sh && sh /tmp/gen-certs.sh
    volumes:
      - ./deployment/kes:/bootstrap:ro
      - ${GATES_DATA_ROOT:-.local-data}/kes-certs:/certs
    restart: "no"

  kes-bootstrap:
    # One-shot, idempotent. OpenBao policy and AppRole for KES, and KES's config.
    # Uses the OpenBao image for the bao CLI. 256m, like openbao-init, because the
    # CLI is killed for memory at 64m.
    image: quay.io/openbao/openbao:2.1.0
    mem_limit: 256m
    depends_on:
      kes-certs:
        condition: service_completed_successfully
      openbao:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./deployment/kes:/bootstrap:ro
      - ${GATES_DATA_ROOT:-.local-data}/openbao-init:/init:ro
      - ${GATES_DATA_ROOT:-.local-data}/kes-certs:/certs:ro
      - ${GATES_DATA_ROOT:-.local-data}/kes:/kes
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - tr -d '\r' < /bootstrap/bootstrap.sh > /tmp/kes-bootstrap.sh && sh /tmp/kes-bootstrap.sh
    restart: "no"

  kes:
    # TODO verify on first run: this image tag and the `server --config` command
    # were not checked against the current release.
    image: quay.io/minio/kes:latest
    mem_limit: 128m
    user: "0"
    command: ["server", "--config=/config/config.yml"]
    depends_on:
      kes-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ${GATES_DATA_ROOT:-.local-data}/kes-certs:/certs:ro
      # Not /kes: the image's program is installed as the file /kes, so a folder
      # cannot be mounted there.
      - ${GATES_DATA_ROOT:-.local-data}/kes:/config:ro
    restart: unless-stopped

  minio-geo:
    # Same release as the existing minio, with its own data folder and no published
    # ports. Reached only on the compose network, by the geo tasks.
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    mem_limit: 512m
    command: server /data --console-address ":9001"
    depends_on:
      kes:
        condition: service_started
    # KES may still be starting, or OpenBao still sealed after a reboot. MinIO exits
    # when it cannot reach its key service, so let it retry until KES answers.
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_KMS_KES_ENDPOINT: https://kes:7373
      MINIO_KMS_KES_CERT_FILE: /certs/minio.crt
      MINIO_KMS_KES_KEY_FILE: /certs/minio.key
      MINIO_KMS_KES_CAPATH: /certs/kes.crt
      MINIO_KMS_KES_KEY_NAME: geo-default
    volumes:
      - ${GATES_DATA_ROOT:-.local-data}/minio-geo:/data
      - ${GATES_DATA_ROOT:-.local-data}/kes-certs:/certs:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- Airflow with the geo environment ----------------------------------
  # Swaps in an image built on top of gates-demo-airflow:local. The existing
  # Dockerfile is untouched. The geo packages live in a separate Python
  # environment (/opt/airflow/geo-venv), so they cannot change the versions
  # dbt and Great Expectations use.
  airflow-init:
    build:
      context: ./deployment/airflow-geo
    image: gates-demo-airflow-geo:local

  airflow:
    image: gates-demo-airflow-geo:local
    # 3g in the demo file; Presidio plus the spaCy model needs headroom.
    mem_limit: 4g
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      postgis:
        condition: service_healthy
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/secrets/openbao-approle.env
      GEO_PYTHON: /opt/airflow/geo-venv/bin/python
      GEO_DB_HOST: postgis
      GEO_DB_PORT: "5432"
      GEO_DB_NAME: ${GEO_DB_NAME:-gates_geo}
      GEOSERVER_URL: http://geoserver:8080/geoserver
    volumes:
      # Only the loader credential file. keys.env (root token, unseal key) and
      # the reader credential file are never mounted into Airflow. The file
      # must exist before the container is created, which openbao-init
      # guarantees through depends_on.
      - ${GATES_DATA_ROOT:-.local-data}/openbao-init/approle-geo-loader.env:/run/secrets/openbao-approle.env:ro
