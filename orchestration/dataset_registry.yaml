# dataset_registry.yaml
# One entry per dataset served by the project_monitoring_dag.py factory.
# Adding a new dataset to this pipeline framework = adding a block here,
# NOT editing airflow_dag.py. Every key here is a parameter to build_dag().
datasets:
  - dataset: project_monitoring
    start_date: "2026-01-01"
    schedule_interval: "@daily"
    api_source_id: dost_pms_api
    file_source_id: pchrd_regional_file_dropbox
    cdc_source_id: project_monitoring_cdc
    file_folder: "sample_data"
    file_pattern: "*.csv"
    agency: PCHRD
    # dbt layer chain, in run order. Each name here must match a real
    # `tags=[...]` value on that dataset's dbt models (see
    # transformation/dbt_project/models/*/*.sql). Not every dataset needs
    # all three — a dataset with no meaningful Silver transformation could
    # declare dbt_layers: [bronze, gold] instead, with no code changes.
    dbt_layers: [bronze, silver, gold]
    # The physical Gold table's alias (see
    # models/gold/project_monitoring/gold_agg_rd_portfolio_performance.sql)
    # — Gold is a use-case aggregate, not a 1:1 promotion of `dataset`, so
    # DataHub's "gold" stage registration needs the real name explicitly.
    gold_table: agg_rd_portfolio_performance

  # Second reference dataset — deliberately has NO config/schema_*.yaml
  # file. Its schema, source, field mappings, and validation rules all live
  # only in the config database (see database/init_config_db.sql) — a
  # single db_multitable ingestion source (two joined tables), not an
  # api/file/cdc channel, so only db_source_id is set here. This is the
  # "database-only config" half of the hybrid YAML/DB story, alongside
  # project_monitoring's YAML-driven config above.
  - dataset: rd_equipment_inventory
    start_date: "2026-03-01"
    schedule_interval: "@weekly"
    db_source_id: pcaarrd_equipment_registry_db
    agency: PCAARRD
    dbt_layers: [bronze, silver, gold]
    gold_table: agg_equipment_condition_summary
